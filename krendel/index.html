<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121816">
  <base target="_blank">
  <link rel="icon" type="image/svg+xml" href="/krendel/assets/icon-DNOsVQRB.svg">
  <title>Krendel</title>
  <script type="module" crossorigin src="/krendel/assets/index-CZNdqFFN.js"></script>
  <link rel="stylesheet" crossorigin href="/krendel/assets/index-JspFDfoZ.css">
</head>
<body>
  <header>
    <h1><span class="logo" aria-hidden="true"></span>Krendel</h1>
    <button type="button" id="play" class="primary">
      <span id="playLabel" title="Ctrl+Enter"><span aria-hidden="true">▶</span> Play</span>
      <span id="stopLabel" title="Ctrl+." hidden><span aria-hidden="true">■</span> Stop</span>
    </button>
    <button type="button" id="update" title="Ctrl+Enter" disabled>Update</button>
    <output id="status" role="status">Ready</output>
    <span class="disclaimer">Early prototype: everything is subject to change</span>
    <div class="legend" id="legend" aria-label="Instruments">
      <span><i class="contended"></i>Unallocated</span>
    </div>
  </header>

  <main>
    <!-- The code, over the piano roll and the chip's lanes. -->
    <section id="stage" aria-label="Pattern">
      <canvas id="score" role="img" aria-label="Piano roll with rendered voices to the left of the playhead and scheduled notes to the right"></canvas>
      <canvas id="ownership" role="img" aria-label="Rendered tone channel A, B, C, noise and envelope ownership"></canvas>
      <div id="editor"></div>
    </section>
    <p id="error" role="alert" hidden></p>

    <aside>
      <div role="tablist" aria-label="Panel">
        <button type="button" role="tab" id="helpTab" aria-controls="help" aria-selected="true">Help</button>
        <button type="button" role="tab" id="settingsTab" aria-controls="settings" aria-selected="false">Settings</button>
      </div>
      <div id="help" role="tabpanel" aria-labelledby="helpTab"></div>
      <!-- As Strudel's settings: each one's name over its control. A name is an editor extension's in
           @strudel/codemirror, or one that settings.js keeps. -->
      <form id="settings" role="tabpanel" aria-labelledby="settingsTab" hidden>
        <fieldset id="chipSettings">
          <label>Chip
            <select name="chip">
              <option value="ay">AY-3-8910</option>
              <option value="ym">YM2149</option>
            </select>
          </label>
          <label>Clock
            <select name="clock">
              <option value="1773400">1.7734 MHz: ZX Spectrum 128</option>
              <option value="1750000">1.75 MHz: Pentagon</option>
              <option value="1789772.5">1.7898 MHz: MSX</option>
              <option value="2000000">2 MHz: Atari ST</option>
              <option value="1000000">1 MHz: Amstrad CPC</option>
            </select>
          </label>
          <p>A change takes effect with the next <b>Play</b>.</p>
        </fieldset>
        <div>
          <label>Audio output device <select name="output"></select></label>
          <button type="button" id="outputNames" hidden>Show device names</button>
        </div>
        <label>Theme <select name="theme"></select></label>
        <!-- fonts.css has these fonts. -->
        <label>Font
          <select name="fontFamily">
            <option value="">System monospace</option>
            <optgroup label="Retro computers">
              <option>ZX Spectrum</option>
              <option>ZX Spectrum 6x8</option>
              <option>MSX</option>
              <option>Cambridge Z88</option>
              <option>IBM PC 8x8</option>
              <option>IBM PC 8x8 Tall</option>
            </optgroup>
            <optgroup label="Fantasy consoles">
              <option>PICO-8</option>
              <option>TIC-80</option>
            </optgroup>
            <optgroup label="Others">
              <option>Iosevka</option>
              <option>JetBrains Mono</option>
              <option>Fira Code</option>
              <option>Fira Code SemiBold</option>
              <option>Hack</option>
              <option>IBM 3270</option>
              <option>BigBlue Terminal</option>
              <option>Monocraft</option>
              <option>Press Start 2P</option>
            </optgroup>
          </select>
        </label>
        <fieldset class="row">
          <legend>Font size</legend>
          <input name="fontSize" type="range" min="8" max="48" aria-label="Font size">
          <input name="fontSize" type="number" min="8" max="48" required aria-label="Font size">
        </fieldset>
        <fieldset class="choices">
          <legend>Keys</legend>
          <label><input type="radio" name="keybindings" value="codemirror">Standard</label>
          <label><input type="radio" name="keybindings" value="vim">Vim</label>
          <label><input type="radio" name="keybindings" value="emacs">Emacs</label>
          <label><input type="radio" name="keybindings" value="vscode">VS Code</label>
        </fieldset>
        <fieldset class="choices">
          <legend>Panel position</legend>
          <label><input type="radio" name="panel" value="left">Left</label>
          <label><input type="radio" name="panel" value="right">Right</label>
          <label><input type="radio" name="panel" value="bottom">Bottom</label>
        </fieldset>
        <fieldset class="checks">
          <legend>More settings</legend>
          <label><input type="checkbox" name="isBracketMatchingEnabled"> Match brackets</label>
          <label><input type="checkbox" name="isBracketClosingEnabled"> Close brackets</label>
          <label><input type="checkbox" name="isLineNumbersDisplayed"> Line numbers</label>
          <label><input type="checkbox" name="isActiveLineHighlighted"> Highlight the cursor's line</label>
          <label><input type="checkbox" name="isPatternHighlightingEnabled"> Highlight playing events in the code</label>
          <label><input type="checkbox" name="isAutoCompletionEnabled"> Complete Strudel's functions</label>
          <label><input type="checkbox" name="isTooltipEnabled"> Strudel's docs on Ctrl and hover</label>
          <label><input type="checkbox" name="isLineWrappingEnabled"> Wrap long lines</label>
          <label><input type="checkbox" name="isTabIndentationEnabled"> Tab indents</label>
          <label><input type="checkbox" name="isMultiCursorEnabled"> Multiple cursors with Cmd/Ctrl+click</label>
          <label><input type="checkbox" name="isFlashEnabled"> Flash the code on Play and Update</label>
        </fieldset>
        <fieldset>
          <legend>Reset settings</legend>
          <button type="button" id="restoreDefaults">Restore default settings</button>
        </fieldset>
      </form>
      <footer>Krendel <span class="version"></span> <span aria-hidden="true">·</span> Live coding for the AY/YM music chip <span aria-hidden="true">·</span> inspired by <a href="https://strudel.cc/">Strudel</a></footer>
    </aside>
  </main>
</body>
</html>
